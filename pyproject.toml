[project]
name = "risktrace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.68.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
